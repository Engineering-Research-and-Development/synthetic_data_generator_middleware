name: Docker Build and Push (DEV)

on:
  push:
    branches:
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Run tests
        run: pytest src/test/

  push-dev:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute dev tag
        id: dev
        run: |
          set -e

          IMAGE=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')

          git fetch --tags
          LAST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)

          RAW_VERSION="${LAST_TAG#v}"
          BASE_VERSION=$(echo "$RAW_VERSION" | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          BASE_VERSION="${BASE_VERSION:-0.1.0}"

          EXISTING=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/v2/${IMAGE}/tags/list" \
            | jq -r '.tags[]' \
            | grep -E "^${BASE_VERSION}\.dev[0-9]+$" \
            | sort -V \
            | tail -1)

          if [[ -z "$EXISTING" ]]; then
            DEV_TAG="${BASE_VERSION}.dev0"
          else
            N=$(echo "$EXISTING" | grep -oE '[0-9]+$')
            DEV_TAG="${BASE_VERSION}.dev$((N+1))"
          fi

          echo "tag=$DEV_TAG" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.dev.outputs.image }}
          tags: |
            type=raw,value=${{ steps.dev.outputs.tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: src
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}